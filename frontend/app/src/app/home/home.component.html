<div class="min-h-screen bg-tierra-900 px-6 py-10">

  <div class="max-w-3xl mx-auto">

    <div class="flex justify-between items-end mb-12">
      <div>
        <p class="text-xs tracking-widest text-tierra-400 uppercase mb-2">Our Moments</p>
        <h1 class="font-serif text-4xl text-tierra-50">Our 1st Year<br>Together</h1>
      </div>
      <button (click)="logout()" class="text-xs tracking-widest text-tierra-500 uppercase hover:text-tierra-300 transition-colors">
        Logout
      </button>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
      <div
        *ngFor="let momento of momentos"
        (click)="abrirMomento(momento)"
        class="cursor-pointer rounded-2xl overflow-hidden aspect-square flex flex-col justify-end p-4 relative group"
        [ngClass]="momento.color">
        <div class="absolute inset-0 bg-tierra-900 opacity-0 group-hover:opacity-20 transition-opacity rounded-2xl"></div>
        <p class="text-xs text-tierra-600 mb-1">{{ momento.fecha }}</p>
        <p class="font-serif text-tierra-800 text-lg leading-tight">{{ momento.titulo }}</p>
      </div>
    </div>

  </div>
</div>

<div *ngIf="momentoSeleccionado" class="fixed inset-0 bg-tierra-900 bg-opacity-80 flex items-center justify-center px-4 z-50">
  <div class="bg-tierra-50 rounded-2xl p-8 max-w-md w-full relative">
    <button (click)="cerrarMomento()" class="absolute top-4 right-4 text-tierra-400 hover:text-tierra-700 text-xl">✕</button>
    <p class="text-xs tracking-widest text-tierra-400 uppercase mb-1">{{ momentoSeleccionado.fecha }}</p>
    <h2 class="font-serif text-2xl text-tierra-900 mb-4">{{ momentoSeleccionado.titulo }}</h2>
    <div class="w-full aspect-video rounded-xl mb-4" [ngClass]="momentoSeleccionado.color"></div>
    <p class="text-sm text-tierra-600 leading-relaxed">{{ momentoSeleccionado.descripcion }}</p>
  </div>
</div>
